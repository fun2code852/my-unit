<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="My Unit">
  <!--
    One favourite unit: a geometric 1 on the same dotted underline
    the extension paints under prices. Brand field #c54546.
  -->
  <rect width="128" height="128" rx="32" fill="#c54546"/>
  <!-- numeral 1: flag + stem (not a font, so it stays sharp at 16px) -->
  <path
    fill="none"
    stroke="#fff"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
    d="M46 44 L66 28 V86"
  />
  <!-- dotted underline = hover affordance on the page -->
  <circle cx="46" cy="104" r="6" fill="#fff"/>
  <circle cx="64" cy="104" r="6" fill="#fff"/>
  <circle cx="82" cy="104" r="6" fill="#fff"/>
</svg>
